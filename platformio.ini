; SlimHuys P1-bridge firmware — WT32-ETH01 + DSMR-parser
;
; Build:    pio run
; Upload:   pio run -t upload --upload-port /dev/cu.usbserial-XXXX
; Monitor:  pio device monitor -b 115200
;
; Eerste flash: USB-naar-TTL adapter op de WT32-ETH01 (RX/TX/GND/EN/IO0).
; Daarna kunnen latere updates via OTA over het netwerk.

[env:wt32-eth01]
platform = espressif32@^6.7.0
board = wt32-eth01
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=0
    ; SlimHuys-API endpoint — override via -DSLIMHUYS_BASE_URL=... bij build
    -D SLIMHUYS_BASE_URL=\"https://slimhuys.nl\"
    -D FIRMWARE_VERSION=\"0.1.0\"

lib_deps =
    matthijskooijman/Arduino-DSMR @ ^0.7
    bblanchon/ArduinoJson @ ^7.0
    https://github.com/tzapu/WiFiManager.git#v2.0.17

; OTA-config voor latere updates — vul host in via env-var
; upload_protocol = espota
; upload_port = slimhuys-p1.local
; upload_flags =
;     --auth=set-this-from-NVS
