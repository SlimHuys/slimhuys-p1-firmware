; SlimHuys P1-bridge firmware — smarthomeshop WaterP1MeterKit V3/V4 + DSMR-parser
;
; Build V3:  pio run -e smarthomeshop-v3
; Build V4:  pio run -e smarthomeshop-v4
; Build all: pio run
; Upload:    pio run -t upload --upload-port /dev/cu.debug-console
; Monitor:   pio device monitor -b 115200
;
; Eerste flash V3: USB-C → /dev/cu.debug-console, esp32dev (LAN8720 PoE)
; Eerste flash V4: USB-C → /dev/cu.usbmodem*, esp32-c6-devkitc-1 (W5500 SPI, geen PoE)

[common]
build_flags_base =
    -D CORE_DEBUG_LEVEL=3
    -D SLIMHUYS_BASE_URL=\"https://slimhuys.nl\"
    -D FIRMWARE_VERSION=\"0.7.43\"
lib_deps =
    https://github.com/matthijskooijman/arduino-dsmr.git
    bblanchon/ArduinoJson @ ^7.0

[env:smarthomeshop-v3]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino

; min_spiffs.csv = 2× 1.9MB app-slots + 0.2MB SPIFFS (we gebruiken geen SPIFFS,
; alleen NVS). Default.csv gaf 2× 1.3MB wat te krap werd nu we ~1.18MB binary
; hebben. Bestaande bridges in 't veld migreren pas bij een full re-flash via
; web-tools; OTA-updates blijven werken zolang firmware in default-app-slot past.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
upload_speed = 115200

; Merged-bin voor eerste flash via ESP Web Tools (manifest met 1 part @ 0x0).
; OTA-updates blijven `firmware.bin` op 0x10000 gebruiken.
extra_scripts = post:scripts/merge_firmware.py

build_flags =
    ${common.build_flags_base}
    -D ARDUINO_USB_CDC_ON_BOOT=0

lib_deps = ${common.lib_deps}

; OTA-config voor latere updates — vul host in via env-var
; upload_protocol = espota
; upload_port = slimhuys-p1.local
; upload_flags =
;     --auth=set-this-from-NVS

[env:smarthomeshop-v4]
; pioarduino is de community-fork van espressif32 die arduino-esp32 3.x levert
; (inclusief ESP32-C6 ondersteuning). Officiële espressif32 zit nog op 2.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; Zelfde partitie-layout als V3: 2× 1.9MB app-slots + 0.2MB NVS.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
upload_speed = 460800

; Merged-bin voor eerste flash via ESP Web Tools. Bootloader op 0x0 (C6-specifiek).
extra_scripts = post:scripts/merge_firmware.py

build_flags =
    ${common.build_flags_base}
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D BOARD_V4

lib_deps = ${common.lib_deps}
